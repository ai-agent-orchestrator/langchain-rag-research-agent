[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "memvid-guardrail"
version = "0.1.0.dev0"
description = "Reusable RAG, retrieval and guard components for legal search and research (stable / incubating / lab)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
memvid = ["memvid-sdk==2.0.160"]
e5 = ["sentence-transformers"]
langchain = ["langchain-core", "langgraph"]
langsmith = ["langsmith"]
test = ["pytest"]
all = ["memvid-guardrail[memvid,langchain,langsmith,test]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "memvid: needs memvid-sdk; never skipped silently",
    "lc: needs langchain-core, langgraph, langsmith",
    "lab: experimental tier",
]

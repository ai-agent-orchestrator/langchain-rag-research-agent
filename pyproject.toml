[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-rag-research-agent"
version = "0.1.0.dev0"
description = "Reusable RAG, retrieval and guard components for legal search and research (stable / incubating / lab)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[project.scripts]
rra = "rag_research_agent.rag.cli:main"

[project.optional-dependencies]
pdf = ["pypdf"]
docx = ["python-docx"]
memvid = ["memvid-sdk==2.0.160"]
chroma = ["chromadb>=1.0"]
e5 = ["sentence-transformers"]
embeddings = ["sentence-transformers"]
kiwi = ["kiwipiepy"]
langchain = ["langchain-core", "langgraph"]
langsmith = ["langsmith"]
test = ["pytest"]
all = ["langchain-rag-research-agent[memvid,chroma,langchain,langsmith,test]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "memvid: needs memvid-sdk; never skipped silently",
    "lc: needs langchain-core, langgraph, langsmith",
    "lab: experimental tier",
]
